<h2>Search Results for "{{ query }}"</h2>

{% if books %}
    {% for book in books %}
        <h4>{{ book.title }}</h4>
        <p>{{ book.author.name }}</p>
        <p>{{ book.category }}</p>
        <p>{{ book.published_date }}</p>
        <hr>
    {% endfor %}
{% else %}
    <p>No books found.</p>
{% endif %}
